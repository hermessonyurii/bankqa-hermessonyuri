name: bankqa-hermessonyuri-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for API healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health; then
              exit 0
            fi
            sleep 5
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Run Cypress tests
        run: npm run test:e2e

      - name: Run API tests
        run: npm run test:api

      - name: Generate test report
        run: |
          echo "# Test Results" > test-report.md
          echo "- E2E: $(npm run test:e2e 2>&1 | grep -c '✓')" >> test-report.md
          echo "- API: $(npm run test:api 2>&1 | grep -c '✓')" >> test-report.md
          cat test-report.md

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankqa-hermessonyuri-portfolio-artifacts
          path: |
            tests/cypress/screenshots
            tests/cypress/videos
            test-report.md

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown stack
        if: always()
        run: docker compose down -v

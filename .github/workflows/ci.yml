name: bankqa-hermessonyuri-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  e2e-tests:
    name: Run BankQA automated tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application stack
        run: docker compose up -d --build

      - name: Wait for API healthcheck
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health; then
              echo "API is healthy"
              exit 0
            fi

            echo "Waiting for API healthcheck... attempt $i"
            sleep 5
          done

          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Run Cypress E2E tests
        run: npm run test:e2e

      - name: Run Cypress API tests
        run: npm run test:api

      - name: Generate test summary
        if: always()
        run: |
          echo "# BankQA Test Execution Summary" > test-report.md
          echo "" >> test-report.md
          echo "- Project: bankqa-hermessonyuri" >> test-report.md
          echo "- Branch: ${{ github.ref_name }}" >> test-report.md
          echo "- Commit: ${{ github.sha }}" >> test-report.md
          echo "- Trigger: ${{ github.event_name }}" >> test-report.md
          echo "- Status: ${{ job.status }}" >> test-report.md
          echo "" >> test-report.md
          echo "Automated tests executed through GitHub Actions using Docker, Node.js 22 and Cypress." >> test-report.md
          cat test-report.md

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankqa-hermessonyuri-artifacts
          path: |
            tests/cypress/screenshots
            tests/cypress/videos
            test-report.md
          if-no-files-found: ignore

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown stack
        if: always()
        run: docker compose down -v